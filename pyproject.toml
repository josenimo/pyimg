[project]
name = "pyimg"
version = "0.1.0"
authors = [
    { name = "Jose Nimo", email = "nimojose@gmail.com" },
]
description = "A collection of Python scripts for scientific image analysis."
requires-python = ">=3.12"
dependencies = [
    "dask>=2025.7.0,<2026",
    "dask-image>=2024.5.3,<2025",
    "tifffile>=2025.6.11,<2026",
    "ipykernel>=6.30.1,<7",
    "loguru>=0.7.3,<0.8",
    "pytest>=8.4.1,<9",
    "click>=8.1.7,<9",
    "ome-types>=0.6.1,<0.7",
]

[tool.pixi.pypi-dependencies]
pyimg = { path = ".", editable = true }

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
seaborn = ">=0.13.2,<0.14"
