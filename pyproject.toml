[project]
name = "pyimg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jose Nimo", email = "nimojose@gmail.com" }
]
requires-python = ">=3.12, <3.13"

dependencies = [
    "dask>=2026.11.0",
    "dask-image>=2026.5.0",
    "tifffile>=2026.11.16",
    "ipykernel>=7.4.0",
    "loguru>=0.8.0",
    "pytest>=9.2.0",
    "click>=8.5.1",
    "ome-types>=0.7.0",
    "seaborn>=0.13.2",
    "pandas>=3.1.1",
    "zarr>=3.4.2",
    "psutil>=7.2.2",
    "imagecodecs>=2026.11.11",
]

[dependency-groups]
dev = [
    "spatialdata>=0.9.0",
]

[project.scripts]
pyimg = "pyimg.cli:cli"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
