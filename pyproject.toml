[project]
name = "pyimage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jose Nimo", email = "nimojose@gmail.com" }
]
requires-python = ">=3.12, <3.13"

dependencies = [
    "dask>=2025.7.0,<2026",
    "dask-image>=2024.5.3,<2025",
    "tifffile>=2025.6.11,<2026",
    "ipykernel>=6.30.1,<7",
    "loguru>=0.7.3,<0.8",
    "pytest>=8.4.1,<9",
    "click>=8.1.7,<9",
    "ome-types>=0.6.1,<0.7",
    "seaborn>=0.13.2",
]

[project.scripts]
pyimage = "pyimage:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
